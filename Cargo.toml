[workspace]
members = ["crates/*", "flutter/covert_connect_ui/rust"]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["WickedCode"]
documentation = ""
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.103"
thiserror = "2.0.18"
is-terminal = "0.4.17"
hyper = { version = "1.10.1", features = ["full"] }
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = "0.7.18"
tarpc = { version = "0.37.0", features = ["full"] }
tokio-serde = {version = "0.9.0", features = ["json"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
hyper-util = { version = "0.1.20", features = ["full"] }
http-body-util = "0.1.3"
bytes = "1.12.0"
shellexpand = "3.1.2"
futures = "0.3.32"
chrono = "0.4.45"
serde_json = "1.0"
serde = { version = "1.0.228", features = ["derive"] }
config = "0.15"
clap = { version = "4.6.1", features = ["derive"] }
rand = "0.10.2"
rand_core = "0.10.1"
base64 = "0.22.1"
pin-project-lite = "0.2.17"
colored = "3.1"
argon2 = "0.5.3"
blake2 = "0.10.6"
blake3 = "1.8.5"
aead = "0.6.1"
tokio-rustls = { version = "0.26.4", default-features = false, features = ["tls12", "logging"]}
webpki-roots = "1.0.8"
aes-gcm = "0.11.0"
aws-lc-rs = "1.17"
chacha20poly1305 = "0.11.0"
ring = "0.17"
parking_lot = { version = "0.12.5", features = ["hardware-lock-elision", "serde"] }
const_format = "0.2.36"
num_enum = "0.7.6"
socket2 = "0.6.4"
async-trait = "0.1"
rustc-hash = "2.1.3"
network-interface = "2.0.5"

sys-process = { path = "crates/sys-process" }
sys-net = { path = "crates/sys-net" }
crypto = { path = "crates/crypto" }
client = { path = "crates/client" }
cc-server = { path = "crates/cc-server" }
net-packet = { path = "crates/net-packet" }

tikv-jemallocator = "0.7"

[profile.release-prod]
inherits = "release"
strip = "symbols"
codegen-units = 1
lto = true
